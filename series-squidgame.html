<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemania - Squid Game</title>
    <link rel="icon" type="image/png" href="logo-v2.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="undsen-tses">
    <a href="index.html" class="site-logo"><img src="logo-v2.png" alt="Logo"> CINEMANIA</a>
    <ul class="list-pages">
        <li><a href="index.html">Нүүр</a></li>
        <li><a href="movies.html">Кино</a></li>
        <li><a href="series.html" class="active">Сериал</a></li>
        <li><a href="trailers.html">Трейлер</a></li>
        <li><a href="top-rated.html">Топ 10</a></li>
        <li><a href="actors.html">Жүжигчид</a></li>
        <li><a href="contact.html">Холбоо барих</a></li>
    </ul>
    <div><span id="date-display" style="color: #aaa; margin-right: 15px; font-size: 14px;"></span><a href="login.html" class="btn">Нэвтрэх</a></div>
</nav>

<div class="container" style="margin-bottom: 60px;">
    <div style="background-color: #1f1f1f; border: 1px solid #333; border-radius: 8px; padding: 30px; display: flex; gap: 30px; flex-wrap: wrap; margin-bottom: 30px;">
        <div style="flex: 1; min-width: 280px;">
            <img src="https://image.tmdb.org/t/p/w500/dDlEmu3EZ0Pgg93K2SVNLCjCSvE.jpg" alt="Squid Game" style="width: 100%; border-radius: 6px; object-fit: cover; max-height: 400px;">
        </div>
        <div style="flex: 2; min-width: 280px; display: flex; flex-direction: column; justify-content: space-between;">
            <div>
                <h1 style="color: #ffc107; margin-bottom: 15px;">Squid Game</h1>
                <p style="color: #aaa; margin-bottom: 15px; font-size: 14px;"><strong>Төрөл:</strong> Триллер, Драма | <strong>Он:</strong> 2021 | <strong>Үнэлгээ:</strong> 7.8/10</p>
                <p style="line-height: 1.6; color: #ddd; margin-bottom: 20px;">Санхүүгийн хүнд байдалд орсон хүмүүс асар өндөр шагналын төлөө амь өрссөн тэмцэл өрнүүлдэг цуврал.</p>
            </div>
            <div style="margin-top: 25px"><a href="series.html" class="btn">Буцах</a></div>
        </div>
    </div>

    <div class="video-card" style="margin-bottom: 20px;">
        
        <div class="video-wrap" style="position: relative; width: 100%; aspect-ratio: 16/9; margin-bottom: 20px;">
            <iframe id="series-player-squid" src="https://vidsrc.me/embed/tv?tmdb=93405&season=1&episode=1" width="100%" height="100%" style="border: none; border-radius: 6px;" allowfullscreen></iframe>
        </div>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
            <label style="color: #aaa;">Улирал: 
                <select id="season-select-squid" style="background: #2a2a2a; color: #fff; padding: 6px 12px; border: 1px solid #444; border-radius: 4px;">
                    <option value="1">1-р бүлэг</option><option value="2">2-р бүлэг</option>
                </select>
            </label>
            <label style="color: #aaa;">Анги: <select id="episode-select-squid" style="background: #2a2a2a; color: #fff; padding: 6px 12px; border: 1px solid #444; border-radius: 4px;"></select></label>
            <button id="play-btn-squid" class="btn" style="padding: 6px 16px;">Үзэх</button>
        </div>
    </div>
</div>

<footer class="Footer" style="margin-top: 50px; padding: 25px 0; text-align: center; border-top: 1px solid #333;">
    <p>Cinemania © 2026.</p>
</footer>
<script>
let dateElement = document.getElementById('date-display');
dateElement.innerText = new Date().getFullYear() + "." + (new Date().getMonth() + 1) + "." + new Date().getDate();

let tmdbIdSquid = 93405;
let seasonEpisodesSquid = { 1: 9, 2: 7 };
let seasonSelectSquid = document.getElementById('season-select-squid');
let episodeSelectSquid = document.getElementById('episode-select-squid');
let seriesPlayerSquid = document.getElementById('series-player-squid');
let playBtnSquid = document.getElementById('play-btn-squid');

function updateEpisodesSquid() {
    let totalEpisodes = seasonEpisodesSquid[seasonSelectSquid.value] || 8;
    episodeSelectSquid.innerHTML = '';
    for (let i = 1; i <= totalEpisodes; i++) {
        let opt = document.createElement('option');
        opt.value = i; opt.innerText = i + "-р анги";
        episodeSelectSquid.appendChild(opt);
    }
}
updateEpisodesSquid();
seasonSelectSquid.addEventListener('change', updateEpisodesSquid);
playBtnSquid.addEventListener('click', function() {
    seriesPlayerSquid.src = `https://vidsrc.me/embed/tv?tmdb=${tmdbIdSquid}&season=${seasonSelectSquid.value}&episode=${episodeSelectSquid.value}`;
});
</script>
</body>
</html>
