<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Cinemania - Бүртгүүлэх</title>
    <link rel="icon" type="image/jpeg" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="undsen-tses">
    <a href="index.html" class="site-logo"><img src="logo.png" alt="Logo"> CINEMANIA</a>
    <ul class="list-pages">
        <li><a href="index.html">Нүүр</a></li>
        <li><a href="movies.html">Кино</a></li>
        <li><a href="series.html">Сериал</a></li>
        <li><a href="trailers.html">Трейлер</a></li>
        <li><a href="top-rated.html">Топ 10</a></li>
        <li><a href="actors.html">Жүжигчид</a></li>
        <li><a href="contact.html">Холбоо барих</a></li>
    </ul>
    <div><span id="date-display" style="color: #aaa; margin-right: 15px; font-size: 14px;"></span><a href="login.html" class="btn">Нэвтрэх</a></div>
</nav>

<div class="container" style="max-width: 450px; margin-top: 30px;">
    <div style="background: #1f1f1f; padding: 30px; border-radius: 8px; border: 1px solid #333;">
        <h2 style="color: #ffc107; text-align: center; margin-bottom: 20px;">Бүртгүүлэх</h2>
        
        <p id="burtgel-messeej" style="text-align: center; margin-bottom: 15px; font-size: 14px;"></p>

        <form id="burtgel-form" onsubmit="burtgeh(event)">
            <div style="margin-bottom: 15px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">Хэрэглэгчийн нэр</label>
                <input type="text" id="ner" placeholder="Нэрээ оруулна уу" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">И-мэйл хаяг</label>
                <input type="email" id="b-email" placeholder="example@gmail.com" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">Нууц үг</label>
                <input type="password" id="b-nuuts" placeholder="********" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
            </div>
            <button type="submit" class="btn" style="width: 100%; text-align: center; cursor: pointer;">Бүртгүүлэх</button>
            <p style="text-align: center; margin-top: 15px; color: #aaa; font-size: 14px;">Бүртгэлтэй юу? <a href="login.html" style="color: #ffc107;">Нэвтрэх</a>.</p>
        </form>
    </div>
</div>

<footer class="Footer" style="position: relative; margin-top: 40px;"><p>Cinemania © 2026.  </p></footer>

<script>
// Он сар гаргах
document.getElementById('date-display').innerText = new Date().getFullYear() + "." + (new Date().getMonth() + 1) + "." + new Date().getDate();

// Энгийн бүртгэх функц
function burtgeh(event) {
    event.preventDefault();
    
    let nerUtga = document.getElementById('ner').value;
    let emailUtga = document.getElementById('b-email').value;
    let nuutsUtga = document.getElementById('b-nuuts').value;
    let aldaaHeseg = document.getElementById('burtgel-messeej');

    if (nerUtga == "") {
        aldaaHeseg.style.color = "red";
        aldaaHeseg.innerText = "Нэрээ оруулна уу!";
    } else {
        if (emailUtga == "") {
            aldaaHeseg.style.color = "red";
            aldaaHeseg.innerText = "И-мэйл хаягаа оруулна уу!";
        } else {
            if (nuutsUtga == "") {
                aldaaHeseg.style.color = "red";
                aldaaHeseg.innerText = "Нууц үгээ оруулна уу!";
            } else {
                aldaaHeseg.style.color = "green";
                aldaaHeseg.innerText = "Амжилттай бүртгэгдлээ!";
            }
        }
    }
}
</script>

</body>
</html>
