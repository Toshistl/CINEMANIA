<div id="auth-container">

</div>

<script>
    // LocalStorage-оос нэвтэрсэн эсэх болон хэрэглэгчийн нэрийг шалгах
    let isLoggedIn = localStorage.getItem('cinemania_logged_in');
    let loggedUser = localStorage.getItem('cinemania_ner');

    if (isLoggedIn === 'true' && loggedUser) {
        let authContainer = document.getElementById('auth-container');
        authContainer.innerHTML = `
            <div style="display: inline-flex; align-items: center; gap: 10px;">
                <!-- Нэр дээр дарахад login.html (профайл) руу орно -->
                <a href="login.html" style="color: #ffc107; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer;" title="Профайл үзэх">
                     ${loggedUser}
                </a> 
                <!-- Гарах товч дарахад зөвхөн нэвтэрсэн төлөвийг арилгана -->
                <a href="login.html" onclick="localStorage.removeItem('cinemania_logged_in');" class="btn" style="padding: 5px 12px; font-size: 13px; background: #d9534f; color: #fff; border-radius: 4px; text-decoration: none;">Гарах</a>
            </div>
        `;
    }
</script>

    let urlParams = new URLSearchParams(window.location.search);
    let searchQuery = urlParams.get('q') ? urlParams.get('q').trim().toLowerCase() : '';

    let searchTitle = document.getElementById('search-title');
    let searchResultsContainer = document.getElementById('search-results');

    if (searchQuery) {
        searchTitle.innerText = `"${urlParams.get('q')}" хайлтын үр дүн`;
        
        let filteredItems = allMediaItems.filter(item => item.title.toLowerCase().includes(searchQuery));

        if (filteredItems.length > 0) {
            filteredItems.forEach(item => {
                let card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <h3 class="movie-title">${item.title}</h3>
                    <p class="movie-news">${item.type} | ${item.year}</p>
                    <a href="${item.link}" class="btn">Дэлгэрэнгүй</a>
                `;
                searchResultsContainer.appendChild(card);
            });
        } else {
            searchResultsContainer.innerHTML = `<p style="color: #aaa; font-size: 16px;">Ямар нэгэн үр дүн олдсонгүй.</p>`;
        }
    } else {
        searchTitle.innerText = "Хайлтын утга хоосон байна.";
        searchResultsContainer.innerHTML = `<p style="color: #aaa; font-size: 16px;">Хайх үг оруулна уу.</p>`;
    }
