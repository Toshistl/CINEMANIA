<div class="container" style="max-width: 600px; margin-top: 30px;">
    <div class="form-card" style="background: #1f1f1f; padding: 30px; border-radius: 8px; border: 1px solid #333;">
        <h2 style="color: #ffc107; text-align: center; margin-bottom: 20px;">Бидэнтэй холбогдох</h2>
        <p style="color: #aaa; text-align: center; margin-bottom: 20px; font-size: 14px;">Сэтгэгдэл, санал хүсэлтээ бидэнд илгээгээрэй.</p>
        <form>
            <div style="margin-bottom: 15px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">Таны нэр</label>
                <input type="text" placeholder="Нэр" style="width: 370px; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">И-мэйл хаяг</label>
                <input type="email" placeholder="example@gmail.com" style="width: 370px; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="color: #ddd; display: block; margin-bottom: 5px;">Таны зурвас</label>
                <textarea rows="4" placeholder="Энд бичнэ үү..." style="width: 370px; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;"></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%; text-align: center; cursor: pointer;">Илгээх</button>
        </form>
    </div>
</div>

<footer class="Footer">
