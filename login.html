<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinemania - Нэвтрэх & Бүртгүүлэх</title>
    <link rel="icon" type="image/png" href="logo-v2.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="undsen-tses">
    <a href="index.html" class="site-logo"><img src="logo-v2.png" alt="Logo"> CINEMANIA</a>
    <ul class="list-pages">
        <li><a href="index.html">Нүүр</a></li>
        <li><a href="movies.html">Кино</a></li>
        <li><a href="series.html">Сериал</a></li>
        <li><a href="trailers.html">Трейлер</a></li>
        <li><a href="top-rated.html">Топ 10</a></li>
        <li><a href="actors.html">Жүжигчид</a></li>
        <li><a href="contact.html">Холбоо барих</a></li>
    </ul>
    <div>
        <span id="date-display" style="color: #aaa; margin-right: 15px; font-size: 14px;"></span>
        <div id="auth-container">
        <a href="login.html" id="login-btn" class="btn">Нэвтрэх</a>
        </div>
        <script>
            let loggedUser = localStorage.getItem('cinemania_ner');
            if (loggedUser) {
                let authContainer = document.getElementById('auth-container');
                authContainer.innerHTML = `
                    <div style="display: inline-flex; align-items: center; gap: 10px;">
                        <a href="login.html" style="color: #ffc107; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer;" title="Профайл үзэх">
                             ${loggedUser}
                        </a> 
                        <a href="login.html" onclick="localStorage.removeItem('cinemania_logged_in'); localStorage.removeItem('cinemania_ner'); localStorage.removeItem('cinemania_avatar');" class="btn" style="padding: 5px 12px; font-size: 13px; background: #d9534f; color: #fff; border-radius: 4px; text-decoration: none;">Гарах</a>
                    </div>
                `;
            }
        </script>
    </div>
</nav>

<div class="container" style="max-width: 500px; margin-top: 40px;">
    
    <div id="main-card" class="form-card" style="background: #1f1f1f; padding: 30px; border-radius: 8px; border: 1px solid #333;">
        
        <!-- Сонгох товчлуурууд (Tabs) -->
        <div id="tab-buttons" style="display: flex; margin-bottom: 25px; border-bottom: 1px solid #333;">
            <button id="tab-burtgel-btn" onclick="showBurtgel()" style="flex: 1; padding: 10px; background: none; border: none; border-bottom: 2px solid #ffc107; color: #ffc107; font-weight: bold; cursor: pointer;">Бүртгүүлэх</button>
            <button id="tab-nevtreh-btn" onclick="showNevtreh()" style="flex: 1; padding: 10px; background: none; border: none; color: #aaa; cursor: pointer;">Нэвтрэх</button>
        </div>

        <!-- 1. БҮРТГҮҮЛЭХ ХЭСЭГ (Анх нээлттэй харагдана) -->
        <div id="burtgel-sec">
            <h3 style="color: #fff; text-align: center; margin-bottom: 15px;">Шинэ хэрэглэгч бүртгүүлэх</h3>
            <p id="b-msg" style="text-align: center; margin-bottom: 15px; font-size: 14px;"></p>
            <form onsubmit="burtgeh(event)">
                <div style="margin-bottom: 15px;">
                    <label style="color: #ddd; display: block; margin-bottom: 5px;">Хэрэглэгчийн нэр</label>
                    <input type="text" id="b-ner" placeholder="Нэрээ оруулна уу">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="color: #ddd; display: block; margin-bottom: 5px;">И-мэйл хаяг</label>
                    <input type="email" id="b-email" placeholder="example@gmail.com" >
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="color: #ddd; display: block; margin-bottom: 5px;">Нууц үг</label>
                    <input type="password" id="b-nuuts" placeholder="********">
                </div>
                <button type="submit" class="btn" style="width: 100%; text-align: center; cursor: pointer;">Бүртгүүлэх</button>
            </form>
        </div>
        

        <div id="nevtreh-sec" style="display: none;">
            <h3 style="color: #fff; text-align: center; margin-bottom: 15px;">Системд нэвтрэх</h3>
            <p id="n-msg" style="text-align: center; margin-bottom: 15px; font-size: 14px;"></p>
            <form onsubmit="nevtreh(event)">
                <div style="margin-bottom: 15px;">
                    <label style="color: #ddd; display: block; margin-bottom: 5px;">И-мэйл хаяг</label>
                    <input type="email" id="n-email" placeholder="example@gmail.com">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="color: #ddd; display: block; margin-bottom: 5px;">Нууц үг</label>
                    <input type="password" id="n-nuuts" placeholder="********">
                </div>
                <button type="submit" class="btn" style="width: 100%; text-align: center; cursor: pointer;">Нэвтрэх</button>
            </form>
        </div>

        <!-- Профайл хэсэг -->
        <div id="profile-sec" class="profile-sec" style="display: none; text-align: center;">
            <!-- Профайл зураг -->
            <img id="p-avatar-img" class="profile-avatar" src="https://static.vecteezy.com/system/resources/previews/036/594/092/non_2x/man-empty-avatar-photo-placeholder-for-social-networks-resumes-forums-and-dating-sites-male-and-female-no-photo-images-for-unfilled-user-profile-free-vector.jpg" alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 10px auto;">
            
            <!-- Зургаа солих хэсэг -->
            <div style="margin-bottom: 15px;">
                <input type="text" id="avatar-url-input" placeholder="Зургийн линк (URL) оруулах..." style="padding: 6px; width: 80%; font-size: 12px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff;">
                <button onclick="changeAvatar()" class="btn" style="padding: 6px 10px; font-size: 12px; margin-top: 5px; cursor: pointer;">Зураг солих</button>
            </div>

            <h3 id="p-ner" style="color: #ffc107; margin-bottom: 5px;"></h3>
            <p id="p-email" style="color: #aaa; font-size: 14px; margin-bottom: 15px;"></p>

            <div class="profile-info" style="background: #252525; padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: left;">
                <p style="margin: 5px 0; color: #ddd;"><strong>Сайтын статус:</strong> Гишүүн</p>
                <!-- Үзсэн кинонуудын тоог localStorage-оос авч харуулна -->
                <p style="margin: 5px 0; color: #ddd;"><strong>Үзсэн кинонуудын тоо:</strong> <span id="watched-count" style="color: #ffc107; font-weight: bold;">0</span></p>
            </div>

            <button onclick="garah()" class="btn profile-logout" style="background: #d9534f; border: none; padding: 8px 15px; cursor: pointer; color: #fff; border-radius: 4px;">Системээс гарах</button>
        </div>

    </div>

</div>

<footer class="Footer" style="margin-top: 50px;"><p>Cinemania © 2026.  </p></footer>

<script>
document.getElementById('date-display').innerText = new Date().getFullYear() + "." + (new Date().getMonth() + 1) + "." + new Date().getDate();

// Таб солих функцууд
function showBurtgel() {
    document.getElementById('burtgel-sec').style.display = 'block';
    document.getElementById('nevtreh-sec').style.display = 'none';
    document.getElementById('profile-sec').style.display = 'none';
    document.getElementById('tab-buttons').style.display = 'flex';
    
    document.getElementById('tab-burtgel-btn').style.color = '#ffc107';
    document.getElementById('tab-burtgel-btn').style.borderBottom = '2px solid #ffc107';
    document.getElementById('tab-nevtreh-btn').style.color = '#aaa';
    document.getElementById('tab-nevtreh-btn').style.borderBottom = 'none';
}

function showNevtreh() {
    document.getElementById('burtgel-sec').style.display = 'none';
    document.getElementById('nevtreh-sec').style.display = 'block';
    document.getElementById('profile-sec').style.display = 'none';
    document.getElementById('tab-buttons').style.display = 'flex';
    
    document.getElementById('tab-nevtreh-btn').style.color = '#ffc107';
    document.getElementById('tab-nevtreh-btn').style.borderBottom = '2px solid #ffc107';
    document.getElementById('tab-burtgel-btn').style.color = '#aaa';
    document.getElementById('tab-burtgel-btn').style.borderBottom = 'none';
}

// Профайлыг харуулах функц
function showProfile() {
    document.getElementById('burtgel-sec').style.display = 'none';
    document.getElementById('nevtreh-sec').style.display = 'none';
    document.getElementById('tab-buttons').style.display = 'none';
    document.getElementById('profile-sec').style.display = 'block';

    let storedNer = localStorage.getItem('cinemania_ner');
    let storedEmail = localStorage.getItem('cinemania_email');

    document.getElementById('p-ner').innerText = storedNer || '';
    document.getElementById('p-email').innerText = storedEmail || '';

    let storedAvatar = localStorage.getItem('cinemania_avatar');
    if (storedAvatar) {
        document.getElementById('p-avatar-img').src = storedAvatar;
    }

    let watchedMovies = localStorage.getItem('cinemania_watched_count') || 0;
    document.getElementById('watched-count').innerText = watchedMovies;
}

// Бүртгүүлэх
function burtgeh(event) {
    event.preventDefault();
    let ner = document.getElementById('b-ner').value.trim();
    let email = document.getElementById('b-email').value.trim();
    let nuuts = document.getElementById('b-nuuts').value.trim();
    let msg = document.getElementById('b-msg');

    if (!ner || !email || !nuuts) {
        msg.style.color = "red";
        msg.innerText = "Бүх талбарыг бөглөнө үү!";
        return;
    }

    localStorage.setItem('cinemania_ner', ner);
    localStorage.setItem('cinemania_email', email);
    localStorage.setItem('cinemania_nuuts', nuuts);
    
    msg.style.color = "green";
    msg.innerText = "Амжилттай бүртгэгдлээ! Нэвтрэх хэсэг рүү шилжиж байна...";
    
    setTimeout(function() {
        showNevtreh();
    }, 1000);
}

// Нэвтрэх
function nevtreh(event) {
    event.preventDefault();
    let email = document.getElementById('n-email').value.trim();
    let nuuts = document.getElementById('n-nuuts').value.trim();
    let msg = document.getElementById('n-msg');

    let storedEmail = localStorage.getItem('cinemania_email');
    let storedNuuts = localStorage.getItem('cinemania_nuuts');

    if (!storedEmail) {
        msg.style.color = "red";
        msg.innerText = "Бүртгэлтэй хэрэглэгч олдсонгүй. Эхлээд бүртгүүлнэ үү!";
    } else if (email === storedEmail && nuuts === storedNuuts) {
        localStorage.setItem('cinemania_logged_in', 'true');
        showProfile();
    } else {
        msg.style.color = "red";
        msg.innerText = "И-мэйл эсвэл нууц үг буруу байна!";
    }
}

// Профайл зураг солих
function changeAvatar() {
    let newUrl = document.getElementById('avatar-url-input').value.trim();
    if (newUrl !== "") {
        localStorage.setItem('cinemania_avatar', newUrl);
        document.getElementById('p-avatar-img').src = newUrl;
        document.getElementById('avatar-url-input').value = "";
    } else {
        alert("Зургийн хүчинтэй линк оруулна уу!");
    }
}

// Системээс гарах (Бүртгэлийг хэвээр үлдээж, зөвхөн нэвтэрсэн төлөвийг арилгана)
function garah() {
    localStorage.removeItem('cinemania_logged_in');
    
    // Формуудыг цэвэрлэх
    document.getElementById('n-email').value = "";
    document.getElementById('n-nuuts').value = "";
    document.getElementById('n-msg').innerText = "";

    showNevtreh();
}

// Хуудас ачаалагдахад шалгах
window.addEventListener('DOMContentLoaded', () => {
    let isLoggedIn = localStorage.getItem('cinemania_logged_in');
    let storedEmail = localStorage.getItem('cinemania_email');

    if (isLoggedIn === 'true' && storedEmail) {
        showProfile();
    } else {
        showNevtreh();
    }
});
</script>
</body>
</html>
